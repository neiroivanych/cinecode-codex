name: Build bootstrap ZIPs

on:
  push:
    tags: ['v*']
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build both ZIPs from the event commit
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          test "$commit" = "$(git rev-parse HEAD)"
          version=$(cat VERSION)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$commit" = "$(git rev-parse "${GITHUB_REF}^{commit}")"
            version=${GITHUB_REF_NAME#v}
          fi
          python -B scripts/cc.py verify
          python -B installer/build/package.py --platform windows --ref "$commit" --version "$version" --out "$RUNNER_TEMP/cinecode-installers"
          python -B installer/build/package.py --platform macos --ref "$commit" --version "$version" --out "$RUNNER_TEMP/cinecode-installers"
          cd "$RUNNER_TEMP/cinecode-installers"
          sha256sum CineCode-Setup-Windows.zip CineCode-Setup-macOS.zip > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cinecode-bootstrap-zips
          path: |
            ${{ runner.temp }}/cinecode-installers/CineCode-Setup-Windows.zip
            ${{ runner.temp }}/cinecode-installers/CineCode-Setup-macOS.zip
            ${{ runner.temp }}/cinecode-installers/SHA256SUMS.txt
          if-no-files-found: error
